<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <style>
        .login-container{
    width:350px;
    margin:50px auto;
}

.login-container h1{
    text-align:center;
    color:#333;
    margin-bottom:20px;
}

.login-container form{
    display:flex;
    flex-direction:column;
}

.login-container label{
    margin-bottom:5px;
    margin-top:15px;
    font-size:14px;
    color:#333;
}

.login-container input[type="email"],
.login-container input[type="password"]{
    padding:10px;
    border:1px solid #bcbcbc;
}

.remember{
    margin-top:15px;
    text-align:right;
    font-size:14px;
}

.erro{
    color:red;
    margin-top:25px;
    margin-bottom:15px;
}

.login-container button{
    width:140px;
    height:40px;

    border:none;
    border-radius:10px;

    background:#028fc7;
    color:white;

    font-size:18px;
    cursor:pointer;
}

.login-container button:hover{
    opacity:.9;
}

    </style>
    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="../home.html">
                    <img src="https://github.com/pw1etec/exercicios-pw/blob/main/pw-lista-8/assets/logo-1.png?raw=true" alt="">
                </a>
            </div>

            <ul class="menu">
                <li><a href="#">SMARTPHONES</a></li>
                <li><a href="#">TABLETS</a></li>
                <li><a href="#">COMPUTADORES</a></li>
            </ul>

            <div class="auth">
                <a href="login.html">LOGIN</a>
                <a href="registrar.html">REGISTRAR</a>
            </div>

        </nav>
    </header>

    <main class="login-container">

        <h1>BEM-VINDO</h1>

        <form>

            <label>Email</label>
            <input type="email" placeholder="email@email.com">

            <label>Senha</label>
            <input type="password" placeholder="senha">

            <div class="remember">
                <input type="checkbox">
                <span>Lembrar de mim</span>
            </div>

            <p class="erro">
                A combinação de email e senha não é válida.
            </p>

            <button type="submit">
                Entrar
            </button>

        </form>

    </main>

</body>
</html>
